<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RxSage Test Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#1e293b}
.app{display:flex;height:100vh;max-width:1400px;margin:0 auto}
.sidebar{width:300px;min-width:300px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:16px;border-bottom:1px solid #e2e8f0}
.sidebar-header h1{font-size:18px;font-weight:700;color:#0f172a}
.sidebar-header p{font-size:12px;color:#64748b;margin-top:4px}
.sidebar-actions{padding:8px 16px;display:flex;gap:8px;border-bottom:1px solid #e2e8f0}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:#f1f5f9;color:#475569}.btn-secondary:hover{background:#e2e8f0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.scenario-list{flex:1;overflow-y:auto;padding:8px}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="sidebar-header">
<h1>🧪 RxSage</h1>
<p>Clinical Test Dashboard</p>
</div>
<div class="sidebar-actions">
<button class="btn btn-primary" id="runAll" onclick="runAll()">▶ Run All</button>
<button class="btn btn-secondary" id="runSelected" onclick="runSelected()" disabled>Run Selected</button>
</div>
<div class="scenario-list" id="scenarioList"></div>
</aside>
<main class="main" id="mainPanel">
<div class="empty-state" id="emptyState">
<h2>Select a scenario</h2>
<p>Click a scenario from the sidebar, then click "Run Selected" to see results.</p>
</div>
<div class="output-panel" id="outputPanel" style="display:none">
<div class="tabs" id="tabs"></div>
<div class="tab-content" id="tabContent"></div>
</div>
</main>
</div>
</body>
</html>

<style>
.scenario-item{padding:10px 12px;margin:4px 0;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all .15s}
.scenario-item:hover{background:#f1f5f9}
.scenario-item.selected{border-color:#2563eb;background:#eff6ff}
.scenario-item .name{font-size:13px;font-weight:600;color:#1e293b}
.scenario-item .meta{font-size:11px;color:#64748b;margin-top:2px;display:flex;gap:6px;align-items:center}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase}
.badge-high{background:#fef2f2;color:#dc2626}.badge-medium{background:#fffbeb;color:#d97706}
.badge-low{background:#f0fdf4;color:#16a34a}.badge-info{background:#f0f9ff;color:#0284c7}
.badge-pass{background:#f0fdf4;color:#16a34a}.badge-fail{background:#fef2f2;color:#dc2626}
.badge-partial{background:#fffbeb;color:#d97706}.badge-running{background:#f0f9ff;color:#0284c7}
.badge-notrun{background:#f9fafb;color:#94a3b8}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8}
.empty-state h2{font-size:20px;margin-bottom:8px}
.output-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:2px solid #e2e8f0;padding:0 16px;background:#fff}
.tab{padding:12px 20px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab:hover{color:#1e293b}.tab.active{color:#2563eb;border-bottom-color:#2563eb}
.tab-content{flex:1;overflow-y:auto;padding:20px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:12px}
.card h3{font-size:14px;font-weight:700;color:#0f172a;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card ul{list-style:none;padding:0}.card li{padding:4px 0;font-size:13px;color:#475569;border-bottom:1px solid #f1f5f9}
.card li:last-child{border:none}
.headline-box{font-size:18px;font-weight:700;color:#0f172a;padding:16px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px}
.proceed-box{display:inline-block;padding:6px 16px;border-radius:6px;font-size:14px;font-weight:700;margin-right:8px}
.proceed-safe{background:#f0fdf4;color:#16a34a}.proceed-caution,.proceed-modify{background:#fffbeb;color:#d97706}
.proceed-do_not_proceed{background:#fef2f2;color:#dc2626}
.status-pill{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700}
.status-safe{background:#f0fdf4;color:#16a34a}.status-caution{background:#fffbeb;color:#d97706}
.status-avoid,.status-contraindicated{background:#fef2f2;color:#dc2626}.status-limit{background:#fffbeb;color:#d97706}
.json-block{background:#1e293b;color:#e2e8f0;padding:16px;border-radius:8px;font-family:'SF Mono',Consolas,monospace;font-size:12px;white-space:pre-wrap;overflow-x:auto;max-height:80vh}
.copy-btn{float:right;padding:4px 12px;background:#334155;color:#e2e8f0;border:none;border-radius:4px;cursor:pointer;font-size:11px}
.copy-btn:hover{background:#475569}
.status-bar{padding:8px 16px;background:#fff;border-top:1px solid #e2e8f0;font-size:12px;color:#64748b;display:flex;align-items:center;gap:12px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot-green{background:#16a34a}.dot-red{background:#dc2626}
.flags-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:900px){.app{flex-direction:column}.sidebar{width:100%;min-width:0;max-height:40vh}}
</style>

<script>
let scenarios=[], results={}, selectedId=null, apiOnline=false;

async function init(){
  checkHealth();
  setInterval(checkHealth,15000);
  try{const r=await fetch('/scenarios');scenarios=await r.json();renderList()}catch(e){console.error(e)}
}

async function checkHealth(){
  try{const r=await fetch('/health-check');const d=await r.json();apiOnline=d.online;updateStatusBar()}catch{apiOnline=false;updateStatusBar()}
}

function updateStatusBar(){
  let sb=document.getElementById('statusBar');
  if(!sb){sb=document.createElement('div');sb.id='statusBar';sb.className='status-bar';document.querySelector('.app').appendChild(sb)}
  const dot=apiOnline?'<span class="dot dot-green"></span> API online':'<span class="dot dot-red"></span> API offline';
  const count=Object.keys(results).length;
  const passed=Object.values(results).filter(r=>r.pass).length;
  sb.innerHTML=`${dot} &nbsp;|&nbsp; Results: ${passed}/${count} passed`;
  document.getElementById('runAll').disabled=!apiOnline;
  document.getElementById('runSelected').disabled=!apiOnline||!selectedId;
}

function renderList(){
  const el=document.getElementById('scenarioList');
  el.innerHTML=scenarios.map((s,i)=>{
    const r=results[s.id];
    const statusBadge=r?`<span class="badge ${r.pass?'badge-pass':'badge-fail'}">${r.pass?'PASS':'FAIL'}</span>`:'<span class="badge badge-notrun">Not run</span>';
    return `<div class="scenario-item ${selectedId===s.id?'selected':''}" onclick="selectScenario('${s.id}')">
      <div class="name">${s.name}</div>
      <div class="meta"><span class="badge badge-${s.expected_risk}">${s.expected_risk}</span>${statusBadge}</div>
    </div>`
  }).join('');
}

function selectScenario(id){
  selectedId=id;renderList();
  document.getElementById('runSelected').disabled=!apiOnline;
  // Always show patient profile first
  showPatientProfile(id);
}

function showPatientProfile(id){
  const s=scenarios.find(x=>x.id===id);if(!s)return;
  const req=s.request;const p=req.patient||{};
  document.getElementById('emptyState').style.display='none';
  document.getElementById('outputPanel').style.display='flex';
  document.getElementById('tabs').innerHTML=`<div class="tab active">Patient Profile</div>`;
  const r=results[id];
  const hasResult=!!r;

  const meds=(req.current_medications||[]).map(m=>`<li><strong>${m.name}</strong> ${m.dosage||''}</li>`).join('');
  const cand=req.candidate_medication||{};
  const conditions=(p.conditions||[]).length?p.conditions.join(', '):'<span style="color:#94a3b8">None listed</span>';
  const allergies=(p.allergies||[]).length?p.allergies.map(a=>`<span class="badge badge-high">${a}</span>`).join(' '):'<span style="color:#94a3b8">None</span>';
  const proc=req.procedure?`<p><strong>Procedure:</strong> ${req.procedure.type||'—'} ${req.procedure.complexity?'('+req.procedure.complexity+')':''}</p>`:'';
  const sedation=req.sedation_requested?`<p><strong>Sedation requested:</strong> ${req.sedation_agent_requested||'Yes'}</p>`:'';

  document.getElementById('tabContent').innerHTML=`
    <div class="card">
      <h3>👤 Patient Demographics</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
        <p><strong>Age:</strong> ${p.age||'—'}</p>
        <p><strong>Sex:</strong> ${p.sex||'—'}</p>
      </div>
    </div>
    <div class="card">
      <h3>🏥 Medical History</h3>
      <p style="font-size:13px"><strong>Conditions:</strong> ${conditions}</p>
      <p style="font-size:13px;margin-top:6px"><strong>Allergies:</strong> ${allergies}</p>
    </div>
    <div class="card">
      <h3>💊 Current Medications</h3>
      <ul style="font-size:13px">${meds||'<li style="color:#94a3b8">None</li>'}</ul>
    </div>
    <div class="card" style="border:2px solid #2563eb;background:#eff6ff">
      <h3>🔬 Candidate Medication</h3>
      <p style="font-size:15px;font-weight:700;color:#1e40af">${cand.name||'—'} <span style="font-weight:400;color:#64748b">${cand.dosage||''}</span></p>
    </div>
    ${proc||sedation?`<div class="card"><h3>📋 Context</h3>${proc}${sedation}</div>`:''}
    <div class="card" style="background:#f8fafc;border:1px dashed #cbd5e1">
      <h3>📝 Scenario</h3>
      <p style="font-size:13px;color:#475569">${s.description||''}</p>
      <p style="font-size:12px;color:#94a3b8;margin-top:4px">Expected risk: <span class="badge badge-${s.expected_risk}">${s.expected_risk}</span></p>
    </div>
    <div style="margin-top:16px;display:flex;gap:12px;align-items:center">
      <button class="btn btn-primary" onclick="runAndShow('${id}')" ${apiOnline?'':'disabled'} style="padding:12px 32px;font-size:15px">
        ▶ Run Analysis
      </button>
      ${hasResult?'<button class="btn btn-secondary" onclick="showResult(\''+id+'\')">View Last Result</button>':''}
      ${!apiOnline?'<span style="font-size:12px;color:#dc2626">API offline — start the server first</span>':''}
    </div>
  `;
}

async function runAndShow(id){
  const s=scenarios.find(x=>x.id===id);if(!s)return;
  // Show loading state in the profile view
  const btn=document.querySelector('.btn-primary');
  if(btn){btn.disabled=true;btn.textContent='⏳ Running...';}
  await runOne(s);
}

async function runSelected(){
  if(!selectedId)return;
  const s=scenarios.find(x=>x.id===selectedId);if(!s)return;
  await runOne(s);
}

async function runAll(){
  for(const s of scenarios){selectedId=s.id;renderList();await runOne(s)}
  renderList();updateStatusBar();
}

async function runOne(s){
  const item=document.querySelector(`.scenario-item.selected`);
  if(item)item.querySelector('.meta').innerHTML='<span class="badge badge-running">Running...</span>';
  try{
    const r=await fetch('/run-scenario',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(s.request)});
    const d=await r.json();
    const data=d.data||{};
    const risk=data.risk_level||'unknown';
    const pass=(risk===s.expected_risk)||(s.expected_risk_alt&&risk===s.expected_risk_alt);
    results[s.id]={data,elapsed:d.elapsed_ms,statusCode:d.status_code,pass,scenario:s};
    renderList();showResult(s.id);updateStatusBar();
  }catch(e){console.error(e);renderList()}
}
</script>

<script>
function showResult(id){
  const r=results[id];if(!r)return;
  document.getElementById('emptyState').style.display='none';
  document.getElementById('outputPanel').style.display='flex';
  const tabs=['Patient','Summary','Workflow','Deep','JSON'];
  document.getElementById('tabs').innerHTML=tabs.map((t,i)=>`<div class="tab ${i===1?'active':''}" onclick="switchTab(${i},'${id}')">${t}</div>`).join('');
  switchTab(1,id);
}

function switchTab(idx,id){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  const r=results[id];
  const tc=document.getElementById('tabContent');
  if(idx===0){showPatientProfile(id);return}
  if(!r){tc.innerHTML='<p style="color:#94a3b8">Run the analysis first to see results.</p>';return}
  const d=r.data;
  if(idx===1)tc.innerHTML=renderSummary(r);
  else if(idx===2)tc.innerHTML=renderWorkflow(d);
  else if(idx===3)tc.innerHTML=renderDeep(d);
  else tc.innerHTML=renderJSON(d);
}

function renderSummary(r){
  const d=r.data;const s=r.scenario;
  const proceedClass=`proceed-${(d.proceed||'safe').replace(/ /g,'_')}`;
  let flags='';
  if(d.flags&&d.flags.length){flags='<div class="flags-row">'+d.flags.map(f=>`<span class="badge badge-${f.severity||'info'}">${f.label}</span>`).join('')+'</div>'}
  return `
    <div class="headline-box">${d.headline||'No headline'}</div>
    <div style="margin-bottom:12px">
      <span class="proceed-box ${proceedClass}">${d.proceed||'?'}</span>
      <span class="badge badge-${d.risk_level||'info'}">${d.risk_level||'?'}</span>
      <span style="margin-left:12px;font-size:12px;color:#64748b">${r.elapsed}ms</span>
      <span class="badge ${r.pass?'badge-pass':'badge-fail'}" style="margin-left:8px">${r.pass?'✓ PASS':'✗ FAIL'}</span>
    </div>
    ${flags}
    <div class="card"><h3>Summary</h3><p style="font-size:13px;color:#475569">${d.summary||'—'}</p></div>
    <div class="card"><h3>Confidence</h3><p style="font-size:13px"><span class="badge badge-${d.confidence||'info'}">${d.confidence||'?'}</span> ${d.confidence_reason||''}</p></div>
    ${d.evidence_quality?`<div class="card"><h3>Evidence Quality</h3><p style="font-size:13px"><span class="badge badge-${d.evidence_quality.overall_evidence_quality==='strong'?'pass':d.evidence_quality.overall_evidence_quality==='moderate'?'partial':'fail'}">${d.evidence_quality.overall_evidence_quality}</span> ${d.evidence_quality.evidence_quality_reason||''}</p><p style="font-size:11px;color:#94a3b8;margin-top:4px">Sources: ${(d.evidence_quality.sources_used||[]).join(', ')}</p></div>`:''}
  `;
}

function renderWorkflow(d){
  const sections=[
    {title:'🦷 Anesthetic Safety',key:'anesthetic_safety',render:renderAnesthetic},
    {title:'💊 Antibiotic Safety',key:'antibiotic_safety',render:renderAntibiotic},
    {title:'💉 Analgesic Safety',key:'analgesic_safety',render:renderAnalgesic},
    {title:'😴 Sedation Safety',key:'sedation_safety',render:renderSedation},
    {title:'👄 Oral Manifestations',key:'oral_manifestations',render:renderOralManifestations},
    {title:'🔧 Procedure Context',key:'procedure_context',render:renderProcedure},
  ];
  return sections.map(s=>{
    const data=d[s.key];
    if(!data)return `<div class="card"><h3>${s.title}</h3><p style="font-size:12px;color:#94a3b8">Not populated</p></div>`;
    return `<div class="card"><h3>${s.title}</h3>${s.render(data)}</div>`;
  }).join('');
}

function pill(status){return `<span class="status-pill status-${status}">${status}</span>`}

function renderAnesthetic(d){
  return `<p><strong>Recommended:</strong> ${d.recommended_agent}</p>
    <p>Epinephrine: ${pill(d.epinephrine_status)} ${d.epinephrine_guidance||''}</p>
    ${d.plain_alternative?`<p>Plain alternative: ${d.plain_alternative}</p>`:''}
    ${d.interaction_notes&&d.interaction_notes.length?'<ul>'+d.interaction_notes.map(n=>`<li>${n}</li>`).join('')+'</ul>':''}`;
}

function renderAntibiotic(d){
  let html=`<p>Prophylaxis: ${d.prophylaxis_indicated?'<span class="badge badge-high">Indicated</span> '+d.prophylaxis_reason:'Not indicated'}</p>`;
  if(d.prophylaxis_agent)html+=`<p>Agent: ${d.prophylaxis_agent}</p>`;
  if(d.candidate_antibiotic_status)html+=`<p>Candidate status: ${d.candidate_antibiotic_status}</p>`;
  if(d.safe_alternatives&&d.safe_alternatives.length)html+='<p><strong>Alternatives:</strong></p><ul>'+d.safe_alternatives.map(a=>`<li>${a.name} ${a.dosage} — ${a.reason}</li>`).join('')+'</ul>';
  if(d.interaction_notes&&d.interaction_notes.length)html+='<ul>'+d.interaction_notes.map(n=>`<li>${n}</li>`).join('')+'</ul>';
  return html;
}

function renderAnalgesic(d){
  return `<p><strong>First line:</strong> ${d.first_line_recommendation}</p>
    <p>Ibuprofen: ${pill(d.ibuprofen_status)} &nbsp; Acetaminophen: ${pill(d.acetaminophen_status)}</p>
    ${d.status_notes&&d.status_notes.length?'<ul>'+d.status_notes.map(n=>`<li>${n}</li>`).join('')+'</ul>':''}
    ${d.interaction_notes&&d.interaction_notes.length?'<ul>'+d.interaction_notes.map(n=>`<li>${n}</li>`).join('')+'</ul>':''}`;
}

function renderSedation(d){
  return `<p><strong>Nitrous:</strong> ${d.nitrous_oxide_note}</p>
    <p>Oral sedation: ${pill(d.oral_sedation_status)}</p>
    ${d.recommended_agent?`<p>Recommended: ${d.recommended_agent}</p>`:''}
    ${d.oral_sedation_notes&&d.oral_sedation_notes.length?'<ul>'+d.oral_sedation_notes.map(n=>`<li>${n}</li>`).join('')+'</ul>':''}
    ${d.alternatives&&d.alternatives.length?'<p>Alternatives: '+d.alternatives.join(', ')+'</p>':''}`;
}

function renderOralManifestations(d){
  if(d.findings&&d.findings.length)return '<ul>'+d.findings.map(f=>`<li><span class="badge badge-${f.severity}">${f.severity}</span> <strong>${f.medication}:</strong> ${f.effect} — ${f.dental_relevance}</li>`).join('')+'</ul>';
  return `<p style="color:#94a3b8">${d.no_findings_note||'No oral manifestations detected.'}</p>`;
}

function renderProcedure(d){
  if(!d.procedure_type&&!d.procedure_specific_notes?.length)return '<p style="color:#94a3b8">No procedure specified.</p>';
  let html=d.procedure_type?`<p><strong>Type:</strong> ${d.procedure_type}</p>`:'';
  if(d.procedure_specific_notes?.length)html+='<ul>'+d.procedure_specific_notes.map(n=>`<li>${n}</li>`).join('')+'</ul>';
  if(d.pre_procedure_checks?.length)html+='<p><strong>Pre-procedure checks:</strong></p><ul>'+d.pre_procedure_checks.map(n=>`<li>${n}</li>`).join('')+'</ul>';
  if(d.procedure_modifications?.length)html+='<p><strong>Modifications:</strong></p><ul>'+d.procedure_modifications.map(n=>`<li>${n}</li>`).join('')+'</ul>';
  return html;
}

function renderDeep(d){
  let html=`<div class="card"><h3>Clinical Explanation</h3><p style="font-size:13px;color:#475569">${d.clinical_explanation||'—'}</p></div>`;
  if(d.patient_risk_factors&&d.patient_risk_factors.length)html+=`<div class="card"><h3>Patient Risk Factors</h3><ul>${d.patient_risk_factors.map(f=>`<li><strong>${f.factor}:</strong> ${f.impact}</li>`).join('')}</ul></div>`;
  if(d.dental_implications)html+=`<div class="card"><h3>Dental Implications</h3><p style="font-size:13px">${d.dental_implications}</p></div>`;
  if(d.physician_referral)html+=`<div class="card"><h3>Physician Referral</h3><p style="font-size:13px">${d.physician_referral}</p></div>`;
  if(d.monitoring_recommendations&&d.monitoring_recommendations.length)html+=`<div class="card"><h3>Monitoring</h3><ul>${d.monitoring_recommendations.map(m=>`<li>${m}</li>`).join('')}</ul></div>`;
  if(d.reasoning_layers_used&&d.reasoning_layers_used.length)html+=`<div class="card"><h3>Reasoning Layers</h3><div class="flags-row">${d.reasoning_layers_used.map(l=>`<span class="badge badge-info">${l}</span>`).join('')}</div></div>`;
  if(d.sources&&d.sources.length)html+=`<div class="card"><h3>Sources</h3><ul>${d.sources.map(s=>`<li><strong>${s.name}</strong>${s.detail?' — '+s.detail:''}</li>`).join('')}</ul></div>`;
  return html;
}

function renderJSON(d){
  const json=JSON.stringify(d,null,2);
  return `<button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('jsonBlock').textContent)">Copy</button><pre class="json-block" id="jsonBlock">${escapeHtml(json)}</pre>`;
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

init();
</script>
