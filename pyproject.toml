[project]
name = "clarvyn"
version = "0.1.0"
description = "Clarvyn Python API — clinical decision support backend for dentists"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "httpx==0.28.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "supabase==2.11.0",
    "openai==1.59.6",
    "hypothesis==6.123.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
